services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sdb_passkey
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdb_passkey"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sdb_passkey
      RP_NAME: SDB Passkey App
      RP_ID: localhost
      EXPECTED_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
